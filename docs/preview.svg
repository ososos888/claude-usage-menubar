<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6ea5"/>
      <stop offset="1" stop-color="#2b4d78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- desktop backdrop -->
  <rect x="0" y="0" width="780" height="470" rx="12" fill="url(#desk)"/>

  <!-- menu bar strip -->
  <rect x="0" y="0" width="780" height="28" rx="12" fill="#ffffff" fill-opacity="0.82"/>
  <rect x="0" y="16" width="780" height="12" fill="#ffffff" fill-opacity="0.82"/>
  <!-- widget (highlighted, as if clicked) -->
  <rect x="430" y="3" width="150" height="22" rx="5" fill="#0a84ff"/>
  <text x="438" y="18" font-size="12.5" fill="#ffffff" font-weight="600">s14% · w25% · ⏳3h58m</text>
  <!-- fake system clock -->
  <text x="768" y="18" font-size="12.5" fill="#1d1d1f" text-anchor="end">2:42 PM</text>

  <!-- dropdown panel -->
  <g filter="url(#shadow)">
    <rect x="430" y="34" width="330" height="366" rx="10" fill="#ffffff"/>
  </g>

  <!-- info rows -->
  <text x="444" y="58" font-size="12.5" fill="#1d1d1f">Session: 14% used · 3h 58m left</text>
  <text x="444" y="78" font-size="12.5" fill="#1d1d1f">Weekly (all models): 25% used · 4d 14h left</text>
  <text x="444" y="98" font-size="12.5" fill="#1d1d1f">Weekly (Fable): 0%</text>
  <line x1="440" y1="110" x2="750" y2="110" stroke="#e5e5e7" stroke-width="1"/>
  <text x="444" y="128" font-size="12" fill="#86868b">Updated: 2026-07-27T01:19:00Z</text>
  <line x1="440" y1="140" x2="750" y2="140" stroke="#e5e5e7" stroke-width="1"/>

  <!-- selected action row -->
  <rect x="436" y="150" width="318" height="20" rx="4" fill="#0a84ff"/>
  <text x="444" y="164" font-size="12.5" fill="#ffffff">Refresh now</text>
  <text x="750" y="164" font-size="12" fill="#ffffff" text-anchor="end" opacity="0.9">⌘R</text>
  <text x="444" y="186" font-size="12.5" fill="#1d1d1f">Copy status</text>
  <text x="444" y="208" font-size="12.5" fill="#1d1d1f">Open usage page</text>
  <line x1="440" y1="220" x2="750" y2="220" stroke="#e5e5e7" stroke-width="1"/>

  <!-- toggles -->
  <text x="444" y="238" font-size="12.5" fill="#1d1d1f">✓&#160;&#160;Animations</text>
  <text x="444" y="260" font-size="12.5" fill="#1d1d1f">&#160;&#160;&#160;&#160;Compact (session only)</text>
  <text x="444" y="282" font-size="12.5" fill="#1d1d1f">&#160;&#160;&#160;&#160;Usage alerts</text>
  <text x="750" y="282" font-size="12.5" fill="#86868b" text-anchor="end">▸</text>
  <text x="444" y="304" font-size="12.5" fill="#1d1d1f">✓&#160;&#160;Start at login</text>
  <line x1="440" y1="316" x2="750" y2="316" stroke="#e5e5e7" stroke-width="1"/>

  <!-- bottom actions -->
  <text x="444" y="334" font-size="12.5" fill="#1d1d1f">Check for Updates…</text>
  <text x="444" y="356" font-size="12.5" fill="#1d1d1f">About (v1.3.4)</text>
  <text x="444" y="378" font-size="12.5" fill="#1d1d1f">Quit</text>
  <text x="750" y="378" font-size="12" fill="#86868b" text-anchor="end">⌘Q</text>

  <!-- caption -->
  <text x="22" y="436" font-size="13" fill="#ffffff" opacity="0.92" font-weight="600">Claude usage in the menu bar</text>
  <text x="22" y="456" font-size="11.5" fill="#ffffff" opacity="0.72">s = session (5-hour rolling) · w = weekly · ⏳ = time until session reset</text>
</svg>
