<svg xmlns="http://www.w3.org/2000/svg" width="780" height="556" viewBox="0 0 780 556" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6ea5"/>
      <stop offset="1" stop-color="#2b4d78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- desktop backdrop -->
  <rect x="0" y="0" width="780" height="556" rx="12" fill="url(#desk)"/>

  <!-- menu bar strip -->
  <rect x="0" y="0" width="780" height="28" rx="12" fill="#ffffff" fill-opacity="0.82"/>
  <rect x="0" y="16" width="780" height="12" fill="#ffffff" fill-opacity="0.82"/>
  <rect x="430" y="3" width="150" height="22" rx="5" fill="#0a84ff"/>
  <text x="438" y="18" font-size="12.5" fill="#ffffff" font-weight="600">s14% · w25% · ⏳3h58m</text>
  <text x="768" y="18" font-size="12.5" fill="#1d1d1f" text-anchor="end">2:42 PM</text>

  <!-- dropdown panel -->
  <g filter="url(#shadow)">
    <rect x="430" y="34" width="330" height="450" rx="10" fill="#ffffff"/>
  </g>

  <!-- session trend chart -->
  <text x="444" y="56" font-size="12" fill="#86868b">Session trend (this window)</text>
  <!-- y axis: always the full 0..100% budget, solid gridlines every 25% -->
  <g font-size="9" fill="#86868b" text-anchor="end">
    <text x="458" y="71">100%</text>
    <text x="458" y="92">50%</text>
    <text x="458" y="113">0%</text>
  </g>
  <g stroke="#e5e5e7">
    <line x1="462" y1="68" x2="744" y2="68" stroke-width="0.8"/>
    <line x1="462" y1="78.5" x2="744" y2="78.5" stroke-width="0.6"/>
    <line x1="462" y1="89" x2="744" y2="89" stroke-width="0.6"/>
    <line x1="462" y1="99.5" x2="744" y2="99.5" stroke-width="0.6"/>
  </g>
  <line x1="462" y1="110" x2="744" y2="110" stroke="#e5e5e7" stroke-width="1"/>
  <g stroke="#d0d0d3" stroke-width="0.8" stroke-dasharray="1.5 2.5">
    <line x1="462" y1="68" x2="462" y2="110"/>
    <line x1="518" y1="68" x2="518" y2="110"/>
    <line x1="575" y1="68" x2="575" y2="110"/>
    <line x1="631" y1="68" x2="631" y2="110"/>
    <line x1="688" y1="68" x2="688" y2="110"/>
    <line x1="744" y1="68" x2="744" y2="110"/>
  </g>
  <g font-size="8" fill="#9a9aa0" text-anchor="middle">
    <text x="462" y="120">0h</text>
    <text x="518" y="120">1h</text>
    <text x="575" y="120">2h</text>
    <text x="631" y="120">3h</text>
    <text x="688" y="120">4h</text>
    <text x="744" y="120">5h</text>
  </g>
  <!-- 14% used after ~3h, on the fixed 0..100% scale -->
  <path d="M462,109.2 L518,107.5 L575,105.8 L631,104.1 L631,110 L462,110 Z" fill="#0a84ff" fill-opacity="0.18"/>
  <path d="M462,109.2 L518,107.5 L575,105.8 L631,104.1" fill="none" stroke="#0a84ff" stroke-width="1.5"/>
  <circle cx="631" cy="104.1" r="2.6" fill="#0a84ff"/>
  <line x1="440" y1="122" x2="750" y2="122" stroke="#e5e5e7" stroke-width="1"/>

  <!-- info rows -->
  <text x="444" y="142" font-size="12.5" fill="#1d1d1f">Session: 14% used · 3h 58m left</text>
  <text x="444" y="162" font-size="12.5" fill="#1d1d1f">Weekly (all models): 25% used · 4d 14h left</text>
  <text x="444" y="182" font-size="12.5" fill="#1d1d1f">Weekly (Fable): 0%</text>
  <line x1="440" y1="194" x2="750" y2="194" stroke="#e5e5e7" stroke-width="1"/>
  <text x="444" y="212" font-size="12" fill="#86868b">Updated: 2026-07-28T08:40:23Z</text>
  <line x1="440" y1="224" x2="750" y2="224" stroke="#e5e5e7" stroke-width="1"/>

  <!-- selected action row -->
  <rect x="436" y="234" width="318" height="20" rx="4" fill="#0a84ff"/>
  <text x="444" y="248" font-size="12.5" fill="#ffffff">Refresh now</text>
  <text x="750" y="248" font-size="12" fill="#ffffff" text-anchor="end" opacity="0.9">⌘R</text>
  <text x="444" y="270" font-size="12.5" fill="#1d1d1f">Copy status</text>
  <text x="444" y="292" font-size="12.5" fill="#1d1d1f">Open usage page</text>
  <line x1="440" y1="304" x2="750" y2="304" stroke="#e5e5e7" stroke-width="1"/>

  <!-- toggles -->
  <text x="444" y="322" font-size="12.5" fill="#1d1d1f">✓&#160;&#160;Animations</text>
  <text x="444" y="344" font-size="12.5" fill="#1d1d1f">&#160;&#160;&#160;&#160;Compact (session only)</text>
  <text x="444" y="366" font-size="12.5" fill="#1d1d1f">&#160;&#160;&#160;&#160;Usage alerts</text>
  <text x="750" y="366" font-size="12.5" fill="#86868b" text-anchor="end">▸</text>
  <text x="444" y="388" font-size="12.5" fill="#1d1d1f">✓&#160;&#160;Start at login</text>
  <line x1="440" y1="400" x2="750" y2="400" stroke="#e5e5e7" stroke-width="1"/>

  <!-- bottom actions -->
  <text x="444" y="418" font-size="12.5" fill="#1d1d1f">Check for Updates…</text>
  <text x="444" y="440" font-size="12.5" fill="#1d1d1f">About (v1.6.1)</text>
  <text x="444" y="462" font-size="12.5" fill="#1d1d1f">Quit</text>
  <text x="750" y="462" font-size="12" fill="#86868b" text-anchor="end">⌘Q</text>

  <!-- caption -->
  <text x="22" y="520" font-size="13" fill="#ffffff" opacity="0.92" font-weight="600">Claude usage in the menu bar</text>
  <text x="22" y="540" font-size="11.5" fill="#ffffff" opacity="0.72">s = session (5-hour rolling) · w = weekly · ⏳ = time until session reset</text>
</svg>
